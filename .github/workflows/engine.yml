# Produces something that can actually be run.
#
# Everything is built from this repository now. Until phase 2 bring-up landed
# the renderer could only be compiled inside a checkout of the fork it came
# from, and this workflow synced it there; that is gone along with the harness.
# The output is a zip that unpacks over a retail install: engine, both
# renderers, gamecode, and the shader pak the modernised renderer loads at
# startup.

name: engine

# A run that is already obsolete is 15 minutes of waiting for an answer about
# code that has been replaced. Newer push wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      trace:
        description: "Compile the renderer's operation trace into this package"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'code/**'
      # games/** was missing here while it was called codeJK2, so a change
      # confined to the Jedi Outcast gamecode built nothing on push.
      - 'games/**'
      - 'shared/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'third_party/**'
      - 'tools/shadergen/**'
      - '.github/workflows/engine.yml'

env:
  # sccache stores its objects in the Actions cache rather than on the runner,
  # which is what makes it survive from one run to the next.
  SCCACHE_GHA_ENABLED: "true"
  # Without this the version header falls back to __DATE__, and a compiler cache
  # refuses to store any translation unit that reads it - correctly, since the
  # answer changes at midnight. A fixed date makes those files cacheable and the
  # build reproducible; it is only the string the console prints.
  SOURCE_DATE_EPOCH: "1767225600"

jobs:
  # The shader pak is platform independent - SPIR-V, compiled by glslc - so it
  # is built once here and consumed by every packaging job. It is also the one
  # part that needs a shader toolchain, which is a nuisance to install on
  # Windows and an apt package here.
  shaders:
    name: shaders.pak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install glslc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslc

      - name: Compile every variant
        run: python3 tools/shadergen/shadergen.py build --out spv

      - name: Pack
        run: python3 tools/shadergen/shadergen.py pack --spv-dir spv --out shaders.pak

      - uses: actions/upload-artifact@v4
        with:
          name: shaders-pak
          path: shaders.pak
          if-no-files-found: error

  package:
    name: ${{ matrix.name }}
    needs: shaders
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-2022
            # Named, not inferred: the runners have MinGW on PATH and it picks
            # itself over MSVC, which is not what the rest of the toolchain
            # expects.
            configure_extra: -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows
            python: python
            config: Release
          - name: linux-x86_64
            os: ubuntu-24.04
            configure_extra: -G Ninja
            python: python3
            config: Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: jkx

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libsdl2-dev libjpeg-dev libpng-dev \
                                  zlib1g-dev libopenal-dev libgl1-mesa-dev libvulkan-dev

      # Only SDL2: zlib, libpng and libjpeg are vendored in lib/ and build from
      # source. lib/SDL2 was a checked-in Windows SDK and went out with the
      # other committed binaries, so this is where SDL2 comes from now - the
      # same place the ci workflow gets it.
      # Building SDL2 from source on every run is minutes that buy nothing: the
      # package list has one entry in it and does not change.
      - name: Cache vcpkg
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-sdl2-vulkan

      # SDL is what creates the window, and a build of it without Vulkan support
      # cannot create a Vulkan one - the renderer then fails at
      # SDL_Vulkan_LoadLibrary on the user's machine with a message about the
      # video driver, which is a long way from here. vcpkg's sdl2 does not build
      # it unless asked. Asked, and then verified, because the difference is
      # invisible until someone runs the game.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install 'sdl2[core,vulkan]:x64-windows'
          config="$VCPKG_INSTALLATION_ROOT/installed/x64-windows/include/SDL2/SDL_config.h"
          if ! grep -q "define SDL_VIDEO_VULKAN 1" "$config"; then
              echo "SDL2 was built without Vulkan support - the renderer cannot create a window"
              grep -i vulkan "$config" || true
              exit 1
          fi

      # Most of a rebuild is the same objects again. sccache keys on the
      # preprocessed source and the flags, so a push that changes one file
      # recompiles one file - which is the difference between waiting nine
      # minutes for an answer and waiting two.
      - uses: mozilla-actions/sccache-action@v0.0.9

      # $GITHUB_WORKSPACE rather than the expression: on Windows the expression
      # expands to D:\a\jkx\jkx before bash sees it, and bash then eats the
      # backslashes as escapes, so the install prefix silently became a
      # different, wrong directory. Through a variable the value is passed
      # verbatim.
      - name: Configure
        shell: bash
        run: >
          cmake -S jkx -B build ${{ matrix.configure_extra }}
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/package"
          -DBuildPortableVersion=OFF
          -DBuildJKAEngine=ON
          -DBuildJKAGame=ON
          -DBuildRdVulkan=ON
          -DBuildJK2Engine=OFF
          -DBuildJK2Game=OFF
         
          -DJKX_VK_TRACE=${{ inputs.trace && 'ON' || 'OFF' }}
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          ${{ runner.os == 'Linux' && '-DUseInternalSDL2=OFF -DUseInternalZlib=OFF -DUseInternalPNG=OFF -DUseInternalJPEG=OFF' || '' }}

      # The interesting line of a failed MSBuild run is somewhere in three
      # thousand lines of warnings, and the tail of the log is whichever project
      # happened to finish last. Pull the errors out rather than going looking.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config ${{ matrix.config }} --parallel 2>&1 | tee build.log || {
            echo "::group::compiler and linker errors"
            grep -aE "error [A-Z]+[0-9]+|error:|LNK[0-9]+" build.log | sort -u | head -60
            echo "::endgroup::"
            exit 1
          }


      # Whether the cache is doing anything is not a thing to assume. One line
      # of hits/misses after each build, and "non-cacheable" with a reason when
      # it declined - that is how a cache that quietly does nothing gets found.
      - name: Cache statistics
        if: always()
        run: sccache --show-stats
        shell: bash

      - name: Install into a package tree
        shell: bash
        working-directory: build
        run: cmake --install . --config ${{ matrix.config }}

      - uses: actions/download-artifact@v4
        with:
          name: shaders-pak
          path: pak

      # vk_shaders.cpp loads shaders.pak through the filesystem, so it has to
      # ship inside a searched game directory rather than next to the
      # executable. Without it the renderer starts and then fails on the first
      # pipeline.
      - name: Stage the shader pak
        shell: bash
        run: |
          tree=$(find "$GITHUB_WORKSPACE/package" -maxdepth 2 -type d -name JediAcademy | head -1)
          if [ -z "$tree" ]; then
              echo "install tree not found under $GITHUB_WORKSPACE/package" >&2
              echo "what is there:" >&2
              ls -la "$GITHUB_WORKSPACE" >&2
              exit 1
          fi
          # base/ is the basegame the engine always searches. The gamecode
          # installs into its own directory beside it, which is searched too
          # when it is the active one, so the pak goes to both rather than
          # depending on which the user runs with.
          mkdir -p "$tree/base"
          cp pak/shaders.pak "$tree/base/shaders.pak"
          while IFS= read -r gamedir; do
              cp pak/shaders.pak "$gamedir/shaders.pak"
          done < <(find "$tree" -mindepth 2 -maxdepth 2 \( -name 'jagame*' -o -name 'jospgame*' \) -printf '%h\n' | sort -u)

          # The renderer already ships under a name of our own - rdsp-vulkan_
          # rather than upstream's rd-vulkan_ - so a package unpacked over an
          # existing install cannot leave someone else's renderer in place and
          # have everything still run. That happened once with the old name and
          # a measurement of the baseline was mistaken for a measurement of this
          # tree.

          # Symbols travel with the binary. The renderer installs a fault
          # handler that walks the stack and resolves it through dbghelp, which
          # finds a PDB by looking next to the module - so the PDB has to be
          # renamed alongside the DLL. Without this a crash report is a column
          # of addresses and someone has to symbolise them by hand.
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
              while IFS= read -r pdb; do
                  base=$(basename "$pdb")
                  case "$base" in vc[0-9]*.pdb) continue ;; esac
                  cp "$pdb" "$tree/$base"
              done < <(find build -name '*.pdb')
          fi

          # One redirect rather than four: the file is opened once, and there
          # is no window in which a half-written stamp exists.
          {
              git -C jkx rev-parse HEAD
              date -u +"%Y-%m-%dT%H:%M:%SZ"
              echo "package: ${{ matrix.name }}"
              echo "trace: ${{ inputs.trace && 'on' || 'off' }}"
          } > "$tree/jkx-build.txt"

          echo "packaged:"
          find "$tree" -maxdepth 2 -type f | sort
          echo "PACKAGE_DIR=$tree" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: jkx-engine-${{ matrix.name }}${{ inputs.trace && '-trace' || '' }}
          path: ${{ env.PACKAGE_DIR }}
          if-no-files-found: error
