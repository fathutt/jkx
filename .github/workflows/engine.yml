# Produces something that can actually be run.
#
# Phase 2 has not happened yet, so code/rd-vulkan cannot be built inside this
# tree: it still expects the multiplayer headers it was written against. Until
# it can, the only way to get a runnable engine out of this repository is the
# same one the developer harness uses - sync the renderer into a checkout of the
# fork it came from, which does build, and build there.
#
# That is what this workflow automates, so that measuring a change does not
# require a local checkout of anything but this repository. The output is a zip
# that unpacks over a retail install: engine, both renderers, gamecode, and the
# shader pak the modernised renderer loads at startup.
#
# Delete this workflow when phase 2 lands and the engine builds here directly.

name: engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/rd-vulkan/**'
      - 'third_party/**'
      - 'tools/devkit/**'
      - 'tools/shadergen/**'
      - '.github/workflows/engine.yml'

env:
  # Pinned rather than tracking the branch: a build that changes underneath us
  # would make two measurements incomparable without anything in this repository
  # having changed. Bump deliberately.
  ETERNALJK_REPO: JKSunny/EternalJK
  ETERNALJK_REF: 7762e3c83a66b2bdfcb1e5df2d304a3b40d1abb5

jobs:
  # The shader pak is platform independent - SPIR-V, compiled by glslc - so it
  # is built once here and consumed by every packaging job. It is also the one
  # part that needs a shader toolchain, which is a nuisance to install on
  # Windows and an apt package here.
  shaders:
    name: shaders.pak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install glslc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslc

      - name: Compile every variant
        run: python3 tools/shadergen/shadergen.py build --out spv

      - name: Pack
        run: python3 tools/shadergen/shadergen.py pack --spv-dir spv --out shaders.pak

      - uses: actions/upload-artifact@v4
        with:
          name: shaders-pak
          path: shaders.pak
          if-no-files-found: error

  package:
    name: ${{ matrix.name }}
    needs: shaders
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-2022
            # Named, not inferred: the runners have MinGW on PATH and it cannot
            # link the MSVC import libraries the fork bundles for Windows.
            configure_extra: -G "Visual Studio 17 2022" -A x64
            python: python
          - name: linux-x86_64
            os: ubuntu-24.04
            configure_extra: -G Ninja
            python: python3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: jkx

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ETERNALJK_REPO }}
          ref: ${{ env.ETERNALJK_REF }}
          path: eternaljk

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libsdl2-dev libjpeg-dev libpng-dev \
                                  zlib1g-dev libopenal-dev libgl1-mesa-dev libvulkan-dev

      # One way only: the harness checkout is disposable and nothing is ever
      # copied back out of it. This is the same script used locally, so a green
      # build here means the same thing a green build on a developer machine
      # does.
      - name: Sync the renderer into the harness checkout
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
        run: bash jkx/tools/devkit/renderer_build_harness.sh "$PWD/eternaljk" --sync-only

      - name: Configure
        shell: bash
        run: >
          cmake -S eternaljk -B build ${{ matrix.configure_extra }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/package
          -DBuildPortableVersion=OFF
          -DBuildMPEngine=ON
          -DBuildMPRdVulkan=ON
          -DBuildMPRdVanilla=ON
          -DBuildMPDed=OFF
          -DBuildMPGame=ON
          -DBuildMPCGame=ON
          -DBuildMPUI=ON
          -DBuildDiscordRichPresence=OFF
          ${{ runner.os == 'Linux' && '-DUseInternalSDL2=OFF -DUseInternalZlib=OFF -DUseInternalPNG=OFF -DUseInternalJPEG=OFF' || '' }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Install into a package tree
        shell: bash
        working-directory: build
        run: cmake --install . --config Release

      - uses: actions/download-artifact@v4
        with:
          name: shaders-pak
          path: pak

      # vk_shaders.cpp loads shaders.pak through the filesystem, so it has to
      # ship inside a searched game directory rather than next to the
      # executable. Without it the renderer starts and then fails on the first
      # pipeline. The fork's own gamecode installs into its basegame directory,
      # so the pak goes there too and the retail base/ is left untouched.
      - name: Stage the shader pak
        shell: bash
        run: |
          tree=$(find package -maxdepth 2 -type d -name JediAcademy | head -1)
          if [ -z "$tree" ]; then echo "install tree not found under package/" >&2; exit 1; fi
          dest="$tree/EternalJK"
          [ -d "$dest" ] || dest="$tree/base"
          mkdir -p "$dest"
          cp pak/shaders.pak "$dest/shaders.pak"
          echo "packaged:"
          find "$tree" -maxdepth 2 -type f | sort
          echo "PACKAGE_DIR=$tree" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: jkx-engine-${{ matrix.name }}
          path: ${{ env.PACKAGE_DIR }}
          if-no-files-found: error
