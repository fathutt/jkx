# Produces something that can actually be run.
#
# Everything is built from this repository now. Until phase 2 bring-up landed
# the renderer could only be compiled inside a checkout of the fork it came
# from, and this workflow synced it there; that is gone along with the harness.
# The output is a zip that unpacks over a retail install: engine, both
# renderers, gamecode, and the shader pak the modernised renderer loads at
# startup.

name: engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/**'
      - 'shared/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'third_party/**'
      - 'tools/shadergen/**'
      - '.github/workflows/engine.yml'

jobs:
  # The shader pak is platform independent - SPIR-V, compiled by glslc - so it
  # is built once here and consumed by every packaging job. It is also the one
  # part that needs a shader toolchain, which is a nuisance to install on
  # Windows and an apt package here.
  shaders:
    name: shaders.pak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install glslc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslc

      - name: Compile every variant
        run: python3 tools/shadergen/shadergen.py build --out spv

      - name: Pack
        run: python3 tools/shadergen/shadergen.py pack --spv-dir spv --out shaders.pak

      - uses: actions/upload-artifact@v4
        with:
          name: shaders-pak
          path: shaders.pak
          if-no-files-found: error

  package:
    name: ${{ matrix.name }}
    needs: shaders
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-2022
            # Named, not inferred: the runners have MinGW on PATH and it picks
            # itself over MSVC, which is not what the rest of the toolchain
            # expects.
            configure_extra: -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows
            python: python
            config: Release
          # Same release build with the renderer's own diagnostics compiled in:
          # the vk_log.log operation trace and, where the layers are installed,
          # validation reporting. Not a debug build - that changes the CRT and
          # the struct layouts the gamecode interface depends on, and the result
          # dies before it can write a single line.
          - name: windows-x86_64-trace
            os: windows-2022
            configure_extra: -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows
            python: python
            config: Release
            trace: "1"
          - name: linux-x86_64
            os: ubuntu-24.04
            configure_extra: -G Ninja
            python: python3
            config: Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: jkx

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libsdl2-dev libjpeg-dev libpng-dev \
                                  zlib1g-dev libopenal-dev libgl1-mesa-dev libvulkan-dev

      # Only SDL2: zlib, libpng and libjpeg are vendored in lib/ and build from
      # source. lib/SDL2 was a checked-in Windows SDK and went out with the
      # other committed binaries, so this is where SDL2 comes from now - the
      # same place the ci workflow gets it.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: vcpkg install sdl2:x64-windows

      # $GITHUB_WORKSPACE rather than the expression: on Windows the expression
      # expands to D:\a\jkx\jkx before bash sees it, and bash then eats the
      # backslashes as escapes, so the install prefix silently became a
      # different, wrong directory. Through a variable the value is passed
      # verbatim.
      - name: Configure
        shell: bash
        run: >
          cmake -S jkx -B build ${{ matrix.configure_extra }}
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/package"
          -DBuildPortableVersion=OFF
          -DBuildSPEngine=ON
          -DBuildSPGame=ON
          -DBuildSPRdVanilla=ON
          -DBuildSPRdVulkan=ON
          -DBuildJK2SPEngine=OFF
          -DBuildJK2SPGame=OFF
          -DBuildJK2SPRdVanilla=OFF
          -DJKX_VK_TRACE=${{ matrix.trace && 'ON' || 'OFF' }}
          ${{ runner.os == 'Linux' && '-DUseInternalSDL2=OFF -DUseInternalZlib=OFF -DUseInternalPNG=OFF -DUseInternalJPEG=OFF' || '' }}

      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Install into a package tree
        shell: bash
        working-directory: build
        run: cmake --install . --config ${{ matrix.config }}

      - uses: actions/download-artifact@v4
        with:
          name: shaders-pak
          path: pak

      # vk_shaders.cpp loads shaders.pak through the filesystem, so it has to
      # ship inside a searched game directory rather than next to the
      # executable. Without it the renderer starts and then fails on the first
      # pipeline.
      - name: Stage the shader pak
        shell: bash
        run: |
          tree=$(find "$GITHUB_WORKSPACE/package" -maxdepth 2 -type d -name JediAcademy | head -1)
          if [ -z "$tree" ]; then
              echo "install tree not found under $GITHUB_WORKSPACE/package" >&2
              echo "what is there:" >&2
              ls -la "$GITHUB_WORKSPACE" >&2
              exit 1
          fi
          # base/ is the basegame the engine always searches. The gamecode
          # installs into its own directory beside it, which is searched too
          # when it is the active one, so the pak goes to both rather than
          # depending on which the user runs with.
          mkdir -p "$tree/base"
          cp pak/shaders.pak "$tree/base/shaders.pak"
          while IFS= read -r gamedir; do
              cp pak/shaders.pak "$gamedir/shaders.pak"
          done < <(find "$tree" -mindepth 2 -maxdepth 2 \( -name 'jagame*' -o -name 'jospgame*' \) -printf '%h\n' | sort -u)

          # The renderer already ships under a name of our own - rdsp-vulkan_
          # rather than upstream's rd-vulkan_ - so a package unpacked over an
          # existing install cannot leave someone else's renderer in place and
          # have everything still run. That happened once with the old name and
          # a measurement of the baseline was mistaken for a measurement of this
          # tree.

          # Symbols travel with the binary. The renderer installs a fault
          # handler that walks the stack and resolves it through dbghelp, which
          # finds a PDB by looking next to the module - so the PDB has to be
          # renamed alongside the DLL. Without this a crash report is a column
          # of addresses and someone has to symbolise them by hand.
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
              while IFS= read -r pdb; do
                  base=$(basename "$pdb")
                  case "$base" in vc[0-9]*.pdb) continue ;; esac
                  cp "$pdb" "$tree/$base"
              done < <(find build -name '*.pdb')
          fi

          git -C jkx rev-parse HEAD > "$tree/jkx-build.txt"
          date -u +"%Y-%m-%dT%H:%M:%SZ" >> "$tree/jkx-build.txt"
          echo "package: ${{ matrix.name }}" >> "$tree/jkx-build.txt"

          echo "packaged:"
          find "$tree" -maxdepth 2 -type f | sort
          echo "PACKAGE_DIR=$tree" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: jkx-engine-${{ matrix.name }}
          path: ${{ env.PACKAGE_DIR }}
          if-no-files-found: error
