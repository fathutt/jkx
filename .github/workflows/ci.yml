name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Action versions are majors, not shas, and they are bumped when the runner says
# so. The runner started warning that checkout and upload-artifact still target
# Node 20 and were being forced onto Node 24; the fix is the newer majors, which
# declare node24 themselves. actions/cache was not named and stays where it is.

env:
  # sccache stores its objects in the Actions cache rather than on the runner,
  # which is what makes it survive from one run to the next.
  SCCACHE_GHA_ENABLED: "true"
  # Without this the version header falls back to __DATE__, and a compiler cache
  # refuses to store any translation unit that reads it - correctly, since the
  # answer changes at midnight. A fixed date makes those files cacheable and the
  # build reproducible; it is only the string the console prints.
  SOURCE_DATE_EPOCH: "1767225600"

jobs:
  # ---------------------------------------------------------------------------
  # Cheap gates first: they fail in seconds and catch the mistakes that are
  # easiest to make. See docs/CODING-STANDARDS.md sections 1, 3 and 6.1.
  # ---------------------------------------------------------------------------
  policy:
    name: policy (ascii / layering / format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Rule 1 - code is Latin-only
        run: python3 tools/ci/check_ascii.py

      - name: Layer dependencies (ratchet, may shrink but never grow)
        run: python3 tools/ci/check_layering.py .

      - name: Shader manifest matches renderer usage
        run: python3 tools/shadergen/shadergen.py verify --strict

      - name: Renderer source list matches the directory
        run: python3 tools/ci/check_sources.py

      # These two ran only in tools/ci/local.sh, which means they ran only when
      # someone remembered. A gate nobody is forced through is a suggestion.
      - name: Engine-to-game interface (ratchet, may shrink but never grow)
        run: python3 tools/ci/check_interface.py .

      - name: String functions with no destination size
        run: python3 tools/ci/check_strings.py .

      - name: One setting, one name
        run: python3 tools/ci/check_cvars.py .

      - name: Per-game branches (ratchet, and banned in the renderer)
        run: python3 tools/ci/check_jk2mode.py .

      # An object still alive when vkDestroyDevice runs is a defect the
      # compiler cannot see and lavapipe does not complain about. The hardware
      # does, and it took a crash report and an evening to get there.
      - name: Vulkan objects have something that destroys them
        run: python3 tools/ci/check_vk_objects.py .

      # This one fails here in two seconds instead of failing in the Windows
      # job twenty minutes in, with an error message that names the wrong
      # token. Everything it looks for compiles cleanly on every compiler this
      # project can run locally, MinGW included.
      - name: No MSVC-only declaration shapes
        run: python3 tools/ci/check_msvc.py

      # An invalid workflow file is a push, a red X and no log at all - the one
      # failure mode with no evidence in it. actionlint reads the expressions
      # and knows which contexts are available where, which is exactly the
      # mistake that is easy to make and impossible to see.
      - name: Workflows are valid
        run: |
          curl -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -no-color

      - name: clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18
          # Only files touched by this PR: reformatting the whole tree at once
          # would destroy git blame (standards 7.2).
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then echo "push build, skipping diff format check"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$base"
          # Through xargs rather than as an unquoted expansion: a bare $changed
          # is a list that shellcheck cannot tell from a string someone forgot
          # to quote, and it is right to ask - a path with a space in it would
          # split into two files that do not exist.
          git diff -z --name-only --diff-filter=ACMR "$base"...HEAD \
              -- '*.c' '*.cpp' '*.h' '*.hpp' \
            | grep -zv '^third_party/' \
            | xargs -0 --no-run-if-empty clang-format-18 --dry-run --Werror

  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.os }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Not the full cross product. Debug and Release select different code, and
      # Windows and Linux select different code, but Windows Debug selects
      # nothing that Linux Debug and Windows Release do not - it was the
      # slowest job in the matrix and the only one that has never failed alone.
      matrix:
        include:
          - os: ubuntu-24.04
            config: Release
          - os: ubuntu-24.04
            config: Debug
          - os: windows-2022
            config: Release
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libsdl2-dev libjpeg-dev libpng-dev \
                                  zlib1g-dev libopenal-dev libgl1-mesa-dev \
                                  libvulkan-dev glslc

      # Only SDL2: zlib, libpng and libjpeg are still vendored in third_party/ and build
      # from source. third_party/SDL2 was a checked-in Windows SDK and went out with the
      # other committed binaries, so this is where SDL2 comes from now.
      - name: Cache vcpkg
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-sdl2-vulkan

      # SDL is what creates the window, and a build of it without Vulkan support
      # cannot create a Vulkan one - the renderer then fails at
      # SDL_Vulkan_LoadLibrary on the user's machine with a message about the
      # video driver, which is a long way from here. vcpkg's sdl2 does not build
      # it unless asked. Asked, and then verified, because the difference is
      # invisible until someone runs the game.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install 'sdl2[core,vulkan]:x64-windows'
          config="$VCPKG_INSTALLATION_ROOT/installed/x64-windows/include/SDL2/SDL_config.h"
          if ! grep -q "define SDL_VIDEO_VULKAN 1" "$config"; then
              echo "SDL2 was built without Vulkan support - the renderer cannot create a window"
              grep -i vulkan "$config" || true
              exit 1
          fi

      # Visual Studio on Windows, not Ninja. The runners have MinGW on PATH, so
      # -G Ninja silently selected it, and MinGW cannot link vcpkg's MSVC import
      # libraries: SDL2main.lib pulled in _RTC_CheckStackVars and friends, which
      # are MSVC runtime-check symbols that GCC has never heard of. Naming the
      # generator picks the toolchain deliberately instead of by PATH order.
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        shell: bash
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          ${{ runner.os == 'Windows' && '-G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows' || '-G Ninja' }}
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DJKX_WARNINGS_AS_ERRORS=OFF
          -DBuildRdVulkan=ON

      # --config is what a multi-config generator reads; single-config ones
      # ignore it and use CMAKE_BUILD_TYPE from the configure step.
      # The failure summary is printed plainly and also written to the job
      # summary. It used to be inside a ::group::, which folds - so a red build
      # showed the command that ran and nothing about why, and reading it meant
      # knowing there was a fold to open. A build log is only useful at the
      # moment someone is annoyed.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config ${{ matrix.config }} --parallel 2>&1 | tee build.log || {
            echo "--- compiler and linker errors ---"
            grep -aE "error [A-Z]+[0-9]+|error:|LNK[0-9]+|fatal error" build.log \
              | sed 's/^[[:space:]]*//' | sort -u | head -60 | tee errors.txt
            {
              echo "### ${{ matrix.os }} ${{ matrix.config }}: build failed"
              echo
              echo '```'
              cat errors.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }


      # Whether the cache is doing anything is not a thing to assume. One line
      # of hits/misses after each build, and "non-cacheable" with a reason when
      # it declined - that is how a cache that quietly does nothing gets found.
      - name: Cache statistics
        if: always()
        run: sccache --show-stats
        shell: bash

      # The .pdb is in here because it has to sit beside the binary at run
      # time - dbghelp looks there and nowhere else - so it ships in the same
      # artifact rather than a separate one nobody would think to download.
      #
      # Note that "path" is a block scalar: every line in it is a pattern, and
      # a line starting with "#" is a pattern too, not a comment. Which is why
      # this paragraph is up here.
      - uses: actions/upload-artifact@v7
        if: matrix.config == 'Release'
        with:
          name: jkx-${{ runner.os }}
          path: |
            build/*.x86_64
            build/*.exe
            build/${{ matrix.config }}/*.exe
            build/${{ matrix.config }}/*.dll
            build/${{ matrix.config }}/*.pdb
            build/**/*.so
            build/**/*.dll
            build/base/**
            build/${{ matrix.config }}/base/**
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Logic that has no business needing a GPU to test: the shader pak reader and
  # the render graph core. A wrong barrier does not crash, it corrupts one
  # vendor at one resolution, so deriving it is checked here rather than in a
  # frame capture.
  unit:
    name: unit tests (asan + ubsan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan-dev
      - name: shader pak reader
        run: |
          g++ -std=c++20 -Wall -Wextra -fsanitize=address,undefined \
              -o pak_test tests/shader_pak_test.cpp code/rd-vulkan/vk_shader_pak.cpp
          ./pak_test
      - name: sound codec
        run: |
          c++ -O2 -std=c++20 -Wall -Werror -DARCH_STRING='"x86_64"' -DJKX_ENGINE \
              -I code -I code/client -I shared -I third_party \
              -o snd_codec_test tests/snd_codec_test.cpp code/client/snd_codec.cpp \
                 third_party/stb/stb_vorbis.c
          ./snd_codec_test tools/verify/fixtures

      - name: launcher install discovery
        run: |
          c++ -O1 -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
              -o install_find_test tests/install_find_test.cpp \
                 code/launcher/jkx_install_find.cpp
          ./install_find_test
          c++ -O1 -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
              -o install_scan_test tests/install_scan_test.cpp \
                 code/launcher/jkx_install_scan.cpp
          ./install_scan_test

      - name: render graph core
        run: |
          g++ -std=c++20 -Wall -Wextra -fsanitize=address,undefined -I third_party/volk \
              -o rg_test tests/render_graph_test.cpp code/rd-vulkan/rg_graph.cpp
          ./rg_test
      # The verification tool cannot be tested end to end without a GPU and the
      # retail game, but its Steam detection and console parsing can, and both
      # are written blind against Windows.
      - name: verification tool
        run: python3 tools/verify/selftest.py
      # Removing the shader names from a model has to remove nothing else. A
      # version of it that zeroed the wrong sixty-four bytes would still produce
      # a model that loads and still produce a model with no textures - which is
      # the thing the lane below tests for, so it would pass on a broken tool.
      - name: the model shader stripper
        run: python3 tools/verify/glm_strip_shaders.py --check
      - name: launcher command line
        run: |
          c++ -O1 -g -std=c++17 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -o launcher_args_test tests/launcher_args_test.cpp \
            code/launcher/jkx_launcher_args.cpp
          ./launcher_args_test
      - name: model normal welding
        run: |
          c++ -O1 -g -std=c++17 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -o mdx_weld_test tests/mdx_weld_test.cpp code/rd-common/mdx_weld.cpp
          ./mdx_weld_test
      # The font atlas is generated, not authored, and its failure modes are
      # pictures - a flat sheet, a shape half a pixel off - that no build log
      # would mention. So the generator draws its own output back and compares
      # it against the bitmap it was built from.
      - name: font atlas generator
        run: |
          python3 -m pip install --quiet --break-system-packages freetype-py pillow numpy
          python3 tools/fontgen/selftest.py
      # The atlases in assets/fonts are generated and checked in, so they can go
      # stale against the tool that made them without anything noticing. This
      # rebuilds them into a temporary directory and compares.
      - name: font atlases are up to date
        run: python3 tools/fontgen/build_fonts.py --check

  # ---------------------------------------------------------------------------
  # The renderer is the part of this repository that changes most and is checked
  # least: it cannot be built here until phase 2, so until now it was compiled
  # only by the packaging workflow, which runs on pushes to main. A renderer
  # that does not build therefore reached main first and was discovered second.
  #
  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitizers (asan + ubsan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libsdl2-dev libjpeg-dev libpng-dev \
                                  zlib1g-dev libopenal-dev libgl1-mesa-dev libvulkan-dev \
                                  glslc
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: >
          cmake -B build-san -G Ninja
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_BUILD_TYPE=Debug
          -DBuildRdVulkan=ON
          -DJKX_ENABLE_ASAN=ON
          -DJKX_ENABLE_UBSAN=ON
      - name: Build
        run: cmake --build build-san --parallel

  # ---------------------------------------------------------------------------
  # The entire Vulkan 1.3 baseline this project targets is supported by
  # lavapipe, so the renderer can be validated on CI without a GPU.
  # Verified 2026-08-08: dynamicRendering, synchronization2, timelineSemaphore,
  # descriptorIndexing, runtimeDescriptorArray, nonUniformIndexing,
  # descriptorBindingPartiallyBound, maintenance4 and all six
  # extendedDynamicState3 features we need are present.
  # ---------------------------------------------------------------------------
  vulkan-baseline:
    name: vulkan 1.3 baseline (lavapipe)
    runs-on: ubuntu-24.04
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      VK_LOADER_LAYERS_ENABLE: VK_LAYER_KHRONOS_validation
    steps:
      - uses: actions/checkout@v6
      - name: Install Vulkan software stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools vulkan-validationlayers
      - name: Assert required features are present
        run: python3 tools/ci/check_vulkan_baseline.py

      - name: Install what the engine needs to start
        run: |
          sudo apt-get install -y ninja-build xvfb glslc libsdl2-dev libjpeg-dev \
                                  libpng-dev zlib1g-dev libopenal-dev libgl1-mesa-dev

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBuildRdVulkan=ON
          cmake --build build --target jkx_jka.x86_64 jkagamex86_64 \
            jkx_jk2.x86_64 jk2gamex86_64 rdsp-vulkan_x86_64 --parallel

      # No GPU and no retail assets, and neither is needed to answer what this
      # asks: does the engine still draw frames on this renderer, and does the
      # validation layer have anything to say about how it does it.
      - name: The engine draws on the Vulkan renderer
        run: |
          JKX_SMOKE_KEEP_SHOT="$PWD/jkx_smoke.tga" \
            bash tools/verify/smoke_headless.sh build

      # The frame the run ended on, so a change of appearance can be looked at
      # rather than argued about.
      - name: Keep the frame
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-frame
          path: jkx_smoke.tga
          if-no-files-found: ignore

      # The other game: jkx_jk2 is code/ built with -DJK2_MODE against
      # games/jk2/game. Half the project had nothing looking at it until this
      # step existed, and the first run of it found a new[] paired with delete
      # that corrupted the heap on every JK2 shutdown.
      - name: The same frames, as Jedi Outcast
        env:
          JKX_SMOKE_GAME: jk2
          JKX_SMOKE_DISPLAY: ':96'
          JKX_SMOKE_NO_VALIDATION: '1'
        run: bash tools/verify/smoke_headless.sh build

      # The player walks and jumps. Until the fixture had a floor - one brush
      # that was the room's own volume marked solid - every trace from inside
      # the room came back allsolid, pmove could not move him at all, and half
      # the game's logic sat outside this bench without anything saying so.
      # What is gated is only that he left the ground; see stage_move in
      # tools/ci/local.sh for why the height itself is not.
      - name: The player moves
        env:
          JKX_SMOKE_MOVE: '1'
          JKX_SMOKE_PLAIN: '1'
          JKX_SMOKE_DISPLAY: ':87'
          JKX_SMOKE_NO_VALIDATION: '1'
        run: bash tools/verify/smoke_headless.sh build

      # A character wearing a skin that does not exist.
      #
      # Two defects, and the second only appeared once the first was fixed. A
      # .glm names no shaders of its own, so a failed skin leaves a model with
      # no materials at all - hence the fallback to model_default.skin. And
      # RE_RegisterSkin took a handle before reading the file, so a failed
      # registration consumed one and put the configstring index and the
      # renderer handle - two numbering spaces the gamecode and the renderer use
      # for the same thing - off by one for everything after it.
      - name: A skin that will not register
        env:
          JKX_SMOKE_SKINFALL: '1'
          JKX_SMOKE_DISPLAY: ':88'
          JKX_SMOKE_NO_VALIDATION: '1'
        run: bash tools/verify/smoke_headless.sh build

      # The same fixture out of a pk3. Every run before this one read loose
      # files, so FS_LoadZipFile, the per-pack hash table, the pak branch of
      # FS_FOpenFileRead and unzReadCurrentFile in FS_Read had never executed in
      # a test - and that is how retail assets and every downloaded mod arrive.
      # make_pk3.py deletes what it packs, so nothing can fall back to the
      # directory and pass by accident.
      - name: The same frames, out of an archive
        env:
          JKX_SMOKE_PK3: '1'
          JKX_SMOKE_SOUND: '1'
          JKX_SMOKE_DISPLAY: ':89'
          JKX_SMOKE_NO_VALIDATION: '1'
        run: bash tools/verify/smoke_headless.sh build

      # Building the sanitizers and never running them checks nothing. The first
      # time this ran it reported two misaligned accesses in the zone allocator,
      # on the first allocation the engine makes.
      - name: Build with sanitizers
        run: |
          cmake -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DJKX_ENABLE_ASAN=ON -DJKX_ENABLE_UBSAN=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBuildRdVulkan=ON -DBuildJK2Engine=OFF -DBuildJK2Game=OFF
          cmake --build build-san --target jkx_jka.x86_64 jkagamex86_64 \
            rdsp-vulkan_x86_64 --parallel

      - name: The same frames, under the sanitizers
        env:
          JKX_SMOKE_DISPLAY: ':98'
          JKX_SMOKE_NO_VALIDATION: '1'
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: bash tools/verify/smoke_headless.sh build-san
