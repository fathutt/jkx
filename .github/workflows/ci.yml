name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # sccache stores its objects in the Actions cache rather than on the runner,
  # which is what makes it survive from one run to the next.
  SCCACHE_GHA_ENABLED: "true"
  # Without this the version header falls back to __DATE__, and a compiler cache
  # refuses to store any translation unit that reads it - correctly, since the
  # answer changes at midnight. A fixed date makes those files cacheable and the
  # build reproducible; it is only the string the console prints.
  SOURCE_DATE_EPOCH: "1767225600"

jobs:
  # ---------------------------------------------------------------------------
  # Cheap gates first: they fail in seconds and catch the mistakes that are
  # easiest to make. See docs/CODING-STANDARDS.md sections 1, 3 and 6.1.
  # ---------------------------------------------------------------------------
  policy:
    name: policy (ascii / layering / format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rule 1 - code is Latin-only
        run: python3 tools/ci/check_ascii.py

      - name: Layer dependencies (ratchet, may shrink but never grow)
        run: python3 tools/ci/check_layering.py .

      - name: Shader manifest matches renderer usage
        run: python3 tools/shadergen/shadergen.py verify --strict

      - name: Renderer source list matches the directory
        run: python3 tools/ci/check_sources.py

      # An invalid workflow file is a push, a red X and no log at all - the one
      # failure mode with no evidence in it. actionlint reads the expressions
      # and knows which contexts are available where, which is exactly the
      # mistake that is easy to make and impossible to see.
      - name: Workflows are valid
        run: |
          curl -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -no-color

      - name: clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18
          # Only files touched by this PR: reformatting the whole tree at once
          # would destroy git blame (standards 7.2).
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then echo "push build, skipping diff format check"; exit 0; fi
          git fetch --no-tags --depth=1 origin "$base"
          changed=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD \
                    -- '*.c' '*.cpp' '*.h' '*.hpp' | grep -v '^lib/' || true)
          [ -z "$changed" ] && exit 0
          clang-format-18 --dry-run --Werror $changed

  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.os }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Not the full cross product. Debug and Release select different code, and
      # Windows and Linux select different code, but Windows Debug selects
      # nothing that Linux Debug and Windows Release do not - it was the
      # slowest job in the matrix and the only one that has never failed alone.
      matrix:
        include:
          - os: ubuntu-24.04
            config: Release
          - os: ubuntu-24.04
            config: Debug
          - os: windows-2022
            config: Release
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libsdl2-dev libjpeg-dev libpng-dev \
                                  zlib1g-dev libopenal-dev libgl1-mesa-dev \
                                  libvulkan-dev glslc

      # Only SDL2: zlib, libpng and libjpeg are still vendored in lib/ and build
      # from source. lib/SDL2 was a checked-in Windows SDK and went out with the
      # other committed binaries, so this is where SDL2 comes from now.
      - name: Cache vcpkg
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-sdl2

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install sdl2:x64-windows
        shell: bash

      # Visual Studio on Windows, not Ninja. The runners have MinGW on PATH, so
      # -G Ninja silently selected it, and MinGW cannot link vcpkg's MSVC import
      # libraries: SDL2main.lib pulled in _RTC_CheckStackVars and friends, which
      # are MSVC runtime-check symbols that GCC has never heard of. Naming the
      # generator picks the toolchain deliberately instead of by PATH order.
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        shell: bash
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          ${{ runner.os == 'Windows' && '-G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows' || '-G Ninja' }}
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DJKX_WARNINGS_AS_ERRORS=OFF
          -DBuildSPRdVulkan=ON

      # --config is what a multi-config generator reads; single-config ones
      # ignore it and use CMAKE_BUILD_TYPE from the configure step.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config ${{ matrix.config }} --parallel 2>&1 | tee build.log || {
            echo "::group::compiler and linker errors"
            grep -aE "error [A-Z]+[0-9]+|error:|LNK[0-9]+" build.log | sort -u | head -60
            echo "::endgroup::"
            exit 1
          }


      # Whether the cache is doing anything is not a thing to assume. One line
      # of hits/misses after each build, and "non-cacheable" with a reason when
      # it declined - that is how a cache that quietly does nothing gets found.
      - name: Cache statistics
        if: always()
        run: sccache --show-stats
        shell: bash

      - uses: actions/upload-artifact@v4
        if: matrix.config == 'Release'
        with:
          name: jkx-${{ runner.os }}
          path: |
            build/*.x86_64
            build/*.exe
            build/${{ matrix.config }}/*.exe
            build/${{ matrix.config }}/*.dll
            build/**/*.so
            build/**/*.dll
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Logic that has no business needing a GPU to test: the shader pak reader and
  # the render graph core. A wrong barrier does not crash, it corrupts one
  # vendor at one resolution, so deriving it is checked here rather than in a
  # frame capture.
  unit:
    name: unit tests (asan + ubsan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan-dev
      - name: shader pak reader
        run: |
          g++ -std=c++20 -Wall -Wextra -fsanitize=address,undefined \
              -o pak_test tests/shader_pak_test.cpp code/rd-vulkan/vk_shader_pak.cpp
          ./pak_test
      - name: render graph core
        run: |
          g++ -std=c++20 -Wall -Wextra -fsanitize=address,undefined -I third_party/volk \
              -o rg_test tests/render_graph_test.cpp code/rd-vulkan/rg_graph.cpp
          ./rg_test
      # The verification tool cannot be tested end to end without a GPU and the
      # retail game, but its Steam detection and console parsing can, and both
      # are written blind against Windows.
      - name: verification tool
        run: python3 tools/verify/selftest.py

  # ---------------------------------------------------------------------------
  # The renderer is the part of this repository that changes most and is checked
  # least: it cannot be built here until phase 2, so until now it was compiled
  # only by the packaging workflow, which runs on pushes to main. A renderer
  # that does not build therefore reached main first and was discovered second.
  #
  # ---------------------------------------------------------------------------
  sanitizers:
    name: sanitizers (asan + ubsan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libsdl2-dev libjpeg-dev libpng-dev \
                                  zlib1g-dev libopenal-dev libgl1-mesa-dev libvulkan-dev \
                                  glslc
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        run: >
          cmake -B build-san -G Ninja
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_BUILD_TYPE=Debug
          -DBuildSPRdVulkan=ON
          -DJKX_ENABLE_ASAN=ON
          -DJKX_ENABLE_UBSAN=ON
      - name: Build
        run: cmake --build build-san --parallel

  # ---------------------------------------------------------------------------
  # The entire Vulkan 1.3 baseline this project targets is supported by
  # lavapipe, so the renderer can be validated on CI without a GPU.
  # Verified 2026-08-08: dynamicRendering, synchronization2, timelineSemaphore,
  # descriptorIndexing, runtimeDescriptorArray, nonUniformIndexing,
  # descriptorBindingPartiallyBound, maintenance4 and all six
  # extendedDynamicState3 features we need are present.
  # ---------------------------------------------------------------------------
  vulkan-baseline:
    name: vulkan 1.3 baseline (lavapipe)
    runs-on: ubuntu-24.04
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      VK_LOADER_LAYERS_ENABLE: VK_LAYER_KHRONOS_validation
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan software stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools vulkan-validationlayers
      - name: Assert required features are present
        run: python3 tools/ci/check_vulkan_baseline.py

      - name: Install what the engine needs to start
        run: |
          sudo apt-get install -y ninja-build xvfb glslc libsdl2-dev libjpeg-dev \
                                  libpng-dev zlib1g-dev libopenal-dev libgl1-mesa-dev

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBuildSPRdVulkan=ON -DBuildJK2SPEngine=OFF -DBuildJK2SPGame=OFF \
            -DBuildJK2SPRdVanilla=OFF
          cmake --build build --target jkx_ja.x86_64 rdsp-vulkan_x86_64 --parallel

      # No GPU and no retail assets, and neither is needed to answer the
      # question this asks: does the engine still come up on this renderer.
      - name: The engine starts on the Vulkan renderer
        run: bash tools/verify/smoke_headless.sh build
